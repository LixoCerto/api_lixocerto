services:
  banco:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lixo_certo
      POSTGRES_USER: lixo_certo
      POSTGRES_PASSWORD: alterar_senha_local
    ports:
      - "5432:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data

  cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ..
      dockerfile: implantacao/docker/api.Dockerfile
    environment:
      AMBIENTE_EXECUCAO: desenvolvimento
      PORTA_GRPC: 50051
      URL_BANCO_DADOS: postgres://lixo_certo:alterar_senha_local@banco:5432/lixo_certo
      URL_REDIS: redis://cache:6379
    depends_on:
      - banco
      - cache
    ports:
      - "50051:50051"

volumes:
  dados_postgres:
