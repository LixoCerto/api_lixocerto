syntax = "proto3";
package lixo_certo.v1;

message ObterProgressoUsuarioRequisicao {
}

message ObterProgressoUsuarioResposta {
  int32 quantidade_pontos = 1;
  string nivel_gamificacao = 2;
  int32 sequencia_dias = 3;
  int32 quantidade_conquistas = 4;
  repeated SeloGamificacao selos = 5;
  repeated PontosPorOrigem resumo_por_origem = 6;
}

message SeloGamificacao {
  string codigo = 1;
  string nome = 2;
  string descricao = 3;
  int32 pontos_minimos = 4;
  string icone = 5;
  bool conquistado = 6;
  string data_conquista = 7;
}

message PontosPorOrigem {
  string origem = 1;
  int32 quantidade_pontos = 2;
  int32 quantidade_eventos = 3;
}

message ObterRankingRequisicao {
  int32 limite_resultado = 1;
}

message ItemRankingResposta {
  int32 posicao_ranking = 1;
  string nome_usuario = 2;
  int32 quantidade_pontos = 3;
  string nivel_gamificacao = 4;
}

message ObterRankingResposta {
  repeated ItemRankingResposta itens_ranking = 1;
}

service ServicoGamificacao {
  rpc ObterProgressoUsuario(ObterProgressoUsuarioRequisicao) returns (ObterProgressoUsuarioResposta);
  rpc ObterRanking(ObterRankingRequisicao) returns (ObterRankingResposta);
}
