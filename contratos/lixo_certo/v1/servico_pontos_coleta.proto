syntax = "proto3";
package lixo_certo.v1;
message ListarPontosColetaRequisicao {
  string cidade_ponto_coleta = 1;
  string categoria_material = 2;
  double latitude = 3;
  double longitude = 4;
  int32 raio_metros = 5;
}
message PontoColetaResposta {
  string id_ponto_coleta = 1;
  string nome_ponto_coleta = 2;
  string endereco_ponto_coleta = 3;
  string cidade_ponto_coleta = 4;
  string estado_ponto_coleta = 5;
  double latitude_ponto_coleta = 6;
  double longitude_ponto_coleta = 7;
  string status_verificacao = 8;
  repeated string categorias_aceitas = 9;
  string origem_informacao = 10;
  string cep_ponto_coleta = 11;
  string horario_funcionamento = 12;
  string telefone_contato = 13;
  string url_informacoes = 14;
  string data_verificacao = 15;
}
message ListarPontosColetaResposta { repeated PontoColetaResposta pontos_coleta = 1; }
message ObterPontoColetaRequisicao { string id_ponto_coleta = 1; }
message ObterPontoColetaResposta { PontoColetaResposta ponto = 1; }
message DadosPontoColetaRequisicao {
  string nome_ponto_coleta = 1;
  string endereco_ponto_coleta = 2;
  string cidade_ponto_coleta = 3;
  string estado_ponto_coleta = 4;
  double latitude_ponto_coleta = 5;
  double longitude_ponto_coleta = 6;
  repeated string categorias_aceitas = 7;
  string origem_informacao = 8;
  string cep_ponto_coleta = 9;
  string horario_funcionamento = 10;
  string telefone_contato = 11;
  string url_informacoes = 12;
}
message BuscarEnderecoPorCoordenadasRequisicao { double latitude = 1; double longitude = 2; }
message BuscarEnderecoPorCoordenadasResposta {
  bool encontrado = 1;
  string cep_ponto_coleta = 2;
  string endereco_ponto_coleta = 3;
  string cidade_ponto_coleta = 4;
  string estado_ponto_coleta = 5;
  string atribuicao = 6;
}
message CriarPontoColetaRequisicao { DadosPontoColetaRequisicao dados = 1; }
message AtualizarPontoColetaRequisicao { string id_ponto_coleta = 1; DadosPontoColetaRequisicao dados = 2; }
message AlterarStatusPontoColetaRequisicao { string id_ponto_coleta = 1; string status_verificacao = 2; }
message ExcluirPontoColetaRequisicao { string id_ponto_coleta = 1; }
message CriarPontoColetaResposta { bool operacao_aceita = 1; string mensagem_resultado = 2; PontoColetaResposta ponto = 3; }
message AtualizarPontoColetaResposta { bool operacao_aceita = 1; string mensagem_resultado = 2; PontoColetaResposta ponto = 3; }
message ExcluirPontoColetaResposta { bool operacao_aceita = 1; string mensagem_resultado = 2; }
message AlterarStatusPontoColetaResposta { bool operacao_aceita = 1; string mensagem_resultado = 2; PontoColetaResposta ponto = 3; }
message RegistrarDescarteRequisicao { string id_ponto_coleta = 1; string categoria_material = 2; string relato = 3; }
message RegistroDescarteResposta {
  string id_registro = 1;
  string id_ponto_coleta = 2;
  string nome_ponto_coleta = 3;
  string cidade_ponto_coleta = 4;
  string categoria_material = 5;
  string status = 6;
  string data_registro = 7;
  string data_revisao = 8;
  string relato = 9;
  string identificador_participante = 10;
  int32 quantidade = 11;
  int32 pontos_concedidos = 12;
}
message RegistrarDescarteResposta { bool operacao_aceita = 1; string mensagem_resultado = 2; RegistroDescarteResposta registro = 3; }
message ListarMeusDescartesRequisicao {}
message ListarMeusDescartesResposta { repeated RegistroDescarteResposta registros = 1; }
message ListarDescartesGestaoRequisicao { string status = 1; }
message ListarDescartesGestaoResposta { repeated RegistroDescarteResposta registros = 1; }
message RevisarDescarteRequisicao { string id_registro = 1; string status = 2; }
message RevisarDescarteResposta { bool operacao_aceita = 1; string mensagem_resultado = 2; RegistroDescarteResposta registro = 3; }
service ServicoPontosColeta {
  rpc ListarPontosColeta(ListarPontosColetaRequisicao) returns (ListarPontosColetaResposta);
  rpc ObterPontoColeta(ObterPontoColetaRequisicao) returns (ObterPontoColetaResposta);
  rpc CriarPontoColeta(CriarPontoColetaRequisicao) returns (CriarPontoColetaResposta);
  rpc AtualizarPontoColeta(AtualizarPontoColetaRequisicao) returns (AtualizarPontoColetaResposta);
  rpc ExcluirPontoColeta(ExcluirPontoColetaRequisicao) returns (ExcluirPontoColetaResposta);
  rpc AlterarStatusPontoColeta(AlterarStatusPontoColetaRequisicao) returns (AlterarStatusPontoColetaResposta);
  rpc BuscarEnderecoPorCoordenadas(BuscarEnderecoPorCoordenadasRequisicao) returns (BuscarEnderecoPorCoordenadasResposta);
  rpc RegistrarDescarte(RegistrarDescarteRequisicao) returns (RegistrarDescarteResposta);
  rpc ListarMeusDescartes(ListarMeusDescartesRequisicao) returns (ListarMeusDescartesResposta);
  rpc ListarDescartesGestao(ListarDescartesGestaoRequisicao) returns (ListarDescartesGestaoResposta);
  rpc RevisarDescarte(RevisarDescarteRequisicao) returns (RevisarDescarteResposta);
}
