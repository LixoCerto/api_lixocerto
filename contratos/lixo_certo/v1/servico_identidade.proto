syntax = "proto3";
package lixo_certo.v1;

message ObterIdentidadeInternaRequisicao {}

message ObterIdentidadeInternaResposta {
  string id_usuario = 1;
  string id_externo = 2;
  string nome_usuario = 3;
  string email_usuario = 4;
  string status_usuario = 5;
}

service ServicoIdentidade {
  rpc ObterIdentidadeInterna(ObterIdentidadeInternaRequisicao) returns (ObterIdentidadeInternaResposta);
}
